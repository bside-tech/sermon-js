name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The same store conformance suite, against real servers
  stores:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http:latest
        ports: ["8079:80"]
        env:
          SRH_MODE: env
          SRH_TOKEN: test_token
          SRH_CONNECTION_STRING: redis://redis:6379
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: test
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8
        ports: ["3306:3306"]
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: sermon
        options: --health-cmd "mysqladmin ping -uroot -ptest" --health-interval 5s --health-timeout 3s --health-retries 20
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest --run test/redis-stores.test.ts test/sql-mongo-stores.test.ts test/aws-pusher-node.test.ts
        env:
          SERMON_TEST_REDIS_URL: redis://localhost:6379
          SERMON_TEST_UPSTASH_URL: http://localhost:8079
          SERMON_TEST_UPSTASH_TOKEN: test_token
          SERMON_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres
          SERMON_TEST_MYSQL_URL: mysql://root:test@localhost:3306/sermon
          SERMON_TEST_MONGODB_URL: mongodb://localhost:27017
